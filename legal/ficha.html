<article class="ficha">
  <header class="ficha-cabecera">
    <div class="contenedor">
      {{> comun/migas/migas}}
      <h1 class="ficha-titulo"><span class="marca">{{item.titulo}}</span></h1>
      <p class="ficha-lead">{{item.descripcion}}</p>
      <div class="ficha-meta">
        <p>Última actualización: <time datetime="{{item.fecha_iso}}">{{item.fecha_texto}}</time></p>
      </div>
    </div>
  </header>
  <div class="contenedor ficha-cuerpo">
{{{cuerpo}}}
    <nav class="legal-otras" aria-label="Otras páginas legales">
      <p><a href="{{seccion.href}}">Ver todas las páginas legales</a></p>
    </nav>
  </div>
</article>
